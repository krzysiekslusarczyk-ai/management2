<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moje Zadania - Task Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/dashboard">📋 Task Management</a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/dashboard">Panel główny</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/tasks">Moje zadania</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/calendar">Kalendarz</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/settings">Ustawienia</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" onclick="logout()">Wyloguj</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-4">
        <div class="row mb-4">
            <div class="col">
                <h2>Moje Zadania</h2>
            </div>
            <div class="col-auto">
                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#newTaskModal">
                    + Nowe zadanie
                </button>
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-md-3">
                <input type="text" class="form-control" id="searchInput" placeholder="Szukaj zadań...">
            </div>
            <div class="col-md-3">
                <select class="form-select" id="filterStatus">
                    <option value="">Wszystkie statusy</option>
                    <option value="pending">Nowe</option>
                    <option value="in_progress">W trakcie</option>
                    <option value="completed">Ukończone</option>
                    <option value="cancelled">Anulowane</option>
                </select>
            </div>
            <div class="col-md-3">
                <select class="form-select" id="filterPriority">
                    <option value="">Wszystkie priorytety</option>
                    <option value="low">Niski</option>
                    <option value="medium">Średni</option>
                    <option value="high">Wysoki</option>
                    <option value="urgent">Nadzwyczajny</option>
                </select>
            </div>
        </div>

        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover" id="tasksTable">
                        <thead>
                            <tr>
                                <th>Tytuł</th>
                                <th>Opis</th>
                                <th>Status</th>
                                <th>Priorytet</th>
                                <th>Termin</th>
                                <th>Akcje</th>
                            </tr>
                        </thead>
                        <tbody id="tasksBody">
                            <tr>
                                <td colspan="6" class="text-center">Ładowanie...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <nav aria-label="Page navigation" id="paginationNav" class="mt-3">
                    <ul class="pagination" id="paginationList">
                    </ul>
                </nav>
            </div>
        </div>
    </div>

    <!-- New Task Modal -->
    <div class="modal fade" id="newTaskModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Nowe zadanie</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="newTaskForm">
                        <div class="mb-3">
                            <label for="taskTitle" class="form-label">Tytuł</label>
                            <input type="text" class="form-control" id="taskTitle" required>
                        </div>
                        <div class="mb-3">
                            <label for="taskDescription" class="form-label">Opis</label>
                            <textarea class="form-control" id="taskDescription" rows="4"></textarea>
                        </div>
                        <div class="mb-3">
                            <label for="taskPriority" class="form-label">Priorytet</label>
                            <select class="form-select" id="taskPriority" required>
                                <option value="low">Niski</option>
                                <option value="medium" selected>Średni</option>
                                <option value="high">Wysoki</option>
                                <option value="urgent">Nadzwyczajny</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="taskDueDate" class="form-label">Termin</label>
                            <input type="datetime-local" class="form-control" id="taskDueDate">
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Dodaj zadanie</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Task Modal -->
    <div class="modal fade" id="editTaskModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Edytuj zadanie</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="editTaskForm">
                        <input type="hidden" id="editTaskId">
                        <div class="mb-3">
                            <label for="editTaskTitle" class="form-label">Tytuł</label>
                            <input type="text" class="form-control" id="editTaskTitle" required>
                        </div>
                        <div class="mb-3">
                            <label for="editTaskDescription" class="form-label">Opis</label>
                            <textarea class="form-control" id="editTaskDescription" rows="4"></textarea>
                        </div>
                        <div class="mb-3">
                            <label for="editTaskStatus" class="form-label">Status</label>
                            <select class="form-select" id="editTaskStatus" required>
                                <option value="pending">Nowe</option>
                                <option value="in_progress">W trakcie</option>
                                <option value="completed">Ukończone</option>
                                <option value="cancelled">Anulowane</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="editTaskPriority" class="form-label">Priorytet</label>
                            <select class="form-select" id="editTaskPriority" required>
                                <option value="low">Niski</option>
                                <option value="medium">Średni</option>
                                <option value="high">Wysoki</option>
                                <option value="urgent">Nadzwyczajny</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="editTaskDueDate" class="form-label">Termin</label>
                            <input type="datetime-local" class="form-control" id="editTaskDueDate">
                        </div>
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary">Zapisz</button>
                            <button type="button" class="btn btn-danger" onclick="deleteTask()">Usuń</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-dark text-white text-center py-4 mt-5">
        <p>&copy; 2024 Task Management System. Wszelkie prawa zastrzeżone.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/tasks.js"></script>
</body>
</html>
