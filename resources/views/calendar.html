<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalendarz - Task Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet" />
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/dashboard">📋 Task Management</a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/dashboard">Panel główny</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/tasks">Moje zadania</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/calendar">Kalendarz</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/settings">Ustawienia</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" onclick="logout()">Wyloguj</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-4">
        <h2>Kalendarz Zadań</h2>
        
        <div class="row">
            <div class="col-lg-9">
                <div class="card">
                    <div class="card-body">
                        <div id="calendar"></div>
                    </div>
                </div>
            </div>
            <div class="col-lg-3">
                <div class="card mb-3">
                    <div class="card-header">
                        <h5>Szczegóły zadania</h5>
                    </div>
                    <div class="card-body" id="taskDetails">
                        <p class="text-muted">Wybierz zadanie na kalendarzu</p>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <h5>Legenda</h5>
                    </div>
                    <div class="card-body">
                        <div class="mb-2">
                            <span class="badge bg-danger">Nadzwyczajny</span>
                        </div>
                        <div class="mb-2">
                            <span class="badge bg-warning">Wysoki</span>
                        </div>
                        <div class="mb-2">
                            <span class="badge bg-info">Średni</span>
                        </div>
                        <div class="mb-2">
                            <span class="badge bg-secondary">Niski</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-dark text-white text-center py-4 mt-5">
        <p>&copy; 2024 Task Management System. Wszelkie prawa zastrzeżone.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
    <script src="/js/calendar.js"></script>
</body>
</html>
